name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.site_env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - site_env: development
            site_origin: https://preview.example.test
          - site_env: production
            site_origin: https://metadata.example.test
    env:
      HUSKY: '0'
      SITE_ENV: ${{ matrix.site_env }}
      SITE_ORIGIN: ${{ matrix.site_origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash .github/scripts/test-quality-gate.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:artifacts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Package the checked build and identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: node .github/scripts/package-artifact.mjs
      - name: Upload validation-only artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-only-${{ matrix.site_env }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '### Validation-only artifact (%s)\n\nID: `%s`\n\nDigest: `%s`\n\nURL: %s\n' \
            "$SITE_ENV" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all validation jobs to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: bash .github/scripts/quality-gate.sh "$VALIDATION_RESULT"
